# fly deploy
#
# Adjust `app` and `primary_region` before the first deploy, or let
# `fly launch` fill them in. Create the volume once, in the same region:
#   fly volumes create tracker_data --size 1

app = "some-tracker"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/tracker.db"

# History lives on the volume, so it survives redeploys.
[[mounts]]
  source = "tracker_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true

  # These three lines are the important ones. A suspended machine stops
  # polling, which silently leaves gaps in every curve, so this app has to
  # stay awake rather than scaling to zero between visits.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
