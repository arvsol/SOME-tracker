name: Deploy dashboard

# Only the UI is deployed here. Readings are fetched from the repo at runtime,
# so the 15-minute poll commits do not trigger a rebuild — hence the paths
# filter below.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'public/styles.css'
      - 'scripts/build-site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/build-site.js

      # enablement turns Pages on via the API if it is not already, using the
      # pages: write permission above — so a fresh clone of this repo deploys
      # without anyone visiting the settings page first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
